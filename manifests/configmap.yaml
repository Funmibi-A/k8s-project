apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-nginx-conf
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
